<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-RVx168a4hhe/+Pb4Cttz48q2jWq/+Boch0bg5M4BVKg='; style-src 'sha256-zgrRC0AuVh56eldsd60oHr8D70H6+CV98qQOSMWzvAg='; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Passport 设置</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f6f3;
  --card: #ffffff;
  --ink: #1d2f24;
  --muted: #62766a;
  --line: #d9e3da;
  --accent: #2b6648;
  --accent-ink: #ffffff;
  --accent-soft: #e4f1e7;
  --ok: #2c7a4b;
  --ok-bg: #e1f1e6;
  --warn: #85560f;
  --warn-bg: #fbf0d8;
  --bad: #a1362c;
  --bad-bg: #fbe8e5;
  --focus: #2f8a63;
  --shadow: 0 1px 2px rgba(20, 40, 28, 0.06);
  font-family:
    -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  font-synthesis: none;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101612;
    --card: #19211c;
    --ink: #e4eee7;
    --muted: #9bb0a2;
    --line: #2b3a30;
    --accent: #58b886;
    --accent-ink: #0c1a12;
    --accent-soft: #1f3327;
    --ok: #7ad3a0;
    --ok-bg: #1d3526;
    --warn: #f0c46e;
    --warn-bg: #3a2f14;
    --bad: #ff9a8f;
    --bad-bg: #3d1f1b;
    --focus: #7ad3a0;
    --shadow: none;
  }
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.5;
}

.shell {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px max(16px, env(safe-area-inset-right)) 140px max(16px, env(safe-area-inset-left));
}

.top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 0 12px;
}

h1 {
  margin: 0;
  font-size: 22px;
  line-height: 1.3;
}

h2 {
  margin: 0;
  font-size: 17px;
  line-height: 1.3;
}

p {
  margin: 4px 0;
}

.muted {
  color: var(--muted);
  font-size: 14px;
}

.remaining {
  color: var(--muted);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin: 12px 0;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.dim {
  opacity: 0.55;
}

.notice {
  margin: 8px 0;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--accent-soft);
  font-size: 15px;
}

.notice.error {
  background: var(--bad-bg);
  color: var(--bad);
}

.notice.warn {
  background: var(--warn-bg);
  color: var(--warn);
}

.notice-action {
  margin-top: 8px;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

button {
  min-height: 44px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  cursor: pointer;
}

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}

button.danger {
  color: var(--bad);
  border-color: var(--bad);
}

button.danger.confirm {
  background: var(--bad);
  color: #ffffff;
}

button.small {
  min-height: 44px;
  padding: 6px 14px;
}

button:disabled,
select:disabled,
input:disabled {
  opacity: 0.5;
  cursor: default;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.wide {
  width: 100%;
}

.gap {
  margin-top: 8px;
}

.field {
  display: block;
  margin: 12px 0;
}

.field > span {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  color: var(--muted);
}

input,
select {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  font-size: 16px;
}

input[type='checkbox'] {
  width: 22px;
  min-height: 22px;
  margin: 0;
}

.check {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  font-size: 15px;
}

.code-input {
  letter-spacing: 1px;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}

.status-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--muted);
  flex: none;
}

.dot.on {
  background: var(--ok);
}

.dot.spin {
  width: 14px;
  height: 14px;
  background: none;
  border: 2px solid var(--line);
  border-top-color: var(--accent);
  animation: spin 0.9s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .dot.spin {
    animation: none;
  }
}

.steps {
  margin: 10px 0 12px;
  padding-left: 22px;
}

.steps li {
  margin: 4px 0;
}

ul.rows {
  list-style: none;
  margin: 0;
  padding: 0;
}

.row {
  border-top: 1px solid var(--line);
}

.row:first-child {
  border-top: 0;
}

.row-main {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 56px;
  padding: 8px 0;
  border: 0;
  border-radius: 0;
  background: none;
  text-align: left;
}

.logo {
  flex: none;
  width: 28px;
  height: 28px;
}

.row-text {
  flex: 1;
  min-width: 0;
}

.row-title,
.row-sub {
  display: block;
  overflow-wrap: anywhere;
}

.row-title {
  font-weight: 600;
}

.row-sub {
  color: var(--muted);
  font-size: 14px;
}

.chip {
  flex: none;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  font-size: 13px;
  white-space: nowrap;
}

.chip.ok {
  background: var(--ok-bg);
  color: var(--ok);
}

.chip.pending {
  background: var(--warn-bg);
  color: var(--warn);
}

.chip.failed {
  background: var(--bad-bg);
  color: var(--bad);
}

.chevron {
  flex: none;
  color: var(--muted);
}

.detail {
  padding: 0 0 12px;
}

.row-error {
  margin: 4px 0 8px;
  color: var(--bad);
  font-size: 14px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.actions button {
  flex: 1;
}

.settings-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}

@media (min-width: 420px) {
  .settings-grid {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
}

.bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
}

.bar-inner {
  max-width: 560px;
  margin: 0 auto;
}

.bar-text {
  margin-bottom: 8px;
  font-size: 15px;
}

#finish {
  min-height: 48px;
}

.sheet {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: flex-end;
  background: rgba(0, 0, 0, 0.4);
}

.sheet-panel {
  width: 100%;
  max-width: 560px;
  max-height: 92vh;
  margin: 0 auto;
  overflow-y: auto;
  padding: 16px max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
  border-radius: 18px 18px 0 0;
  background: var(--card);
}

.segmented {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}

.segmented button {
  flex: 1;
}

.segmented button.on {
  background: var(--accent-soft);
  border-color: var(--accent);
  font-weight: 600;
}

.chip.saved {
  background: var(--accent-soft);
  color: var(--muted);
}

.row.skeleton {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px 0;
}

.bar {
  display: block;
  width: 40%;
  height: 12px;
  border-radius: 6px;
  background: var(--line);
  animation: pulse 1.4s ease-in-out infinite;
}

.bar.wide-bar {
  width: 65%;
}

@keyframes pulse {
  50% {
    opacity: 0.45;
  }
}

@media (prefers-reduced-motion: reduce) {
  .bar {
    animation: none;
  }
}

#content.loading {
  pointer-events: none;
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>Passport 设置</h1>
    <span id="remaining" class="remaining" hidden></span>
  </header>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden>
    <span id="notice-text"></span>
    <div class="notice-action"><button id="notice-action" type="button" hidden></button></div>
  </div>
  <section id="connection" class="card" aria-label="连接">
    <div class="status-line">
      <span id="conn-dot" class="dot"></span><span id="conn-text"></span>
    </div>
    <p id="conn-help" class="muted" hidden></p>
    <ol id="conn-steps" class="steps" hidden>
      <li>用 USB 线连接 Passport</li>
      <li>点下面的“连接 Passport”，选择它的串口</li>
      <li>在 Passport 上打开 USB 设置，页面会自动连接</li>
    </ol>
    <form id="code-form" autocomplete="off" hidden>
      <label class="field"><span>访问码（Passport 屏幕上的热点设置第 3 页）</span>
        <input id="code-input" class="code-input" inputmode="text" autocapitalize="characters"
          autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="24">
      </label>
      <button id="code-submit" class="primary wide" type="submit">连接</button>
    </form>
    <div class="actions">
      <button id="usb-connect" class="primary" type="button" hidden>连接 Passport</button>
      <button id="usb-disconnect" type="button" hidden>断开 USB</button>
    </div>
  </section>
  <div id="content" hidden>
    <section id="accounts-section" class="card" aria-labelledby="accounts-title">
      <div class="section-head">
        <h2 id="accounts-title">账户</h2>
        <button id="add-account" class="small" type="button">+ 添加</button>
      </div>
      <p id="accounts-hint" class="muted" hidden>先添加 Wi‑Fi</p>
      <p id="accounts-empty" class="muted">还没有账户</p>
      <ul id="account-list" class="rows"></ul>
    </section>
    <section id="wifi-section" class="card" aria-labelledby="wifi-title">
      <div class="section-head">
        <h2 id="wifi-title">Wi‑Fi</h2>
        <button id="add-wifi" class="small" type="button">+ 添加</button>
      </div>
      <p id="wifi-empty" class="muted">Passport 联网用的网络，最多 3 个，普通 2.4 GHz</p>
      <ul id="wifi-list" class="rows"></ul>
      <form id="wifi-form" autocomplete="off" hidden>
        <label class="field"><span>名称</span>
          <input id="wifi-ssid" autocomplete="off" autocapitalize="none" spellcheck="false">
        </label>
        <label class="field"><span>密码（无密码的网络请留空）</span>
          <input id="wifi-password" type="password" autocomplete="new-password"
            autocapitalize="none" spellcheck="false">
        </label>
        <label class="check"><input id="wifi-show" type="checkbox">显示密码</label>
        <p id="wifi-error" class="row-error" hidden></p>
        <div class="actions">
          <button id="wifi-cancel" type="button">取消</button>
          <button id="wifi-save" class="primary" type="submit">保存</button>
        </div>
      </form>
    </section>
    <section id="device-section" class="card" aria-labelledby="device-title">
      <div class="section-head"><h2 id="device-title">Passport</h2></div>
      <div class="settings-grid">
        <label class="field"><span>刷新频率</span>
          <select id="refresh-select">
            <option value="manual">手动</option>
            <option value="60">1 分钟</option>
            <option value="300">5 分钟</option>
            <option value="900">15 分钟</option>
            <option value="1800">30 分钟</option>
          </select>
        </label>
        <label class="field"><span>自动息屏</span>
          <select id="sleep-select">
            <option value="0">从不</option>
            <option value="30">30 秒</option>
            <option value="60">1 分钟</option>
            <option value="120">2 分钟</option>
            <option value="300">5 分钟</option>
            <option value="600">10 分钟</option>
          </select>
        </label>
      </div>
    </section>
  </div>
</div>
<footer id="bar" class="bar" hidden>
  <div class="bar-inner">
    <p id="bar-text" class="bar-text"></p>
    <div class="actions">
      <button id="cancel-auth" type="button" hidden>取消授权</button>
      <button id="finish" class="primary" type="button">完成设置</button>
    </div>
  </div>
</footer>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">添加账户</h2>
    <div class="segmented">
      <button id="pick-codex" type="button" class="on">ChatGPT</button>
      <button id="pick-deepseek" type="button">DeepSeek</button>
    </div>
    <form id="codex-form" autocomplete="off">
      <p class="muted">统计 Codex 用量；点完成设置后在 Passport 上授权</p>
      <label class="field"><span>备注名（可不填）</span>
        <input id="codex-label" autocomplete="off" maxlength="32">
      </label>
      <button id="codex-add" class="primary wide" type="submit">添加</button>
    </form>
    <form id="deepseek-form" autocomplete="off" hidden>
      <p class="muted">统计可用余额</p>
      <label class="field"><span>备注名</span>
        <input id="deepseek-label" autocomplete="off" maxlength="32">
      </label>
      <label class="field"><span>密钥</span>
        <input id="deepseek-key" type="password" autocomplete="new-password"
          autocapitalize="none" spellcheck="false">
      </label>
      <label class="check"><input id="deepseek-show" type="checkbox">显示密钥</label>
      <p id="deepseek-error" class="row-error" hidden></p>
      <button id="deepseek-add" class="primary wide" type="submit">添加</button>
    </form>
    <button id="sheet-cancel" class="wide gap" type="button">取消</button>
  </div>
</div>
<script type="module">
if (window.top !== window.self) { document.documentElement.textContent = '请直接打开此页面'; throw 0; }
// The hotspot transport of the setup page: the Passport serves this page itself, and the page
// talks to the same origin. The access code travels in a header and lives in page memory only.

class HttpTransportError extends Error {
  // `device` carries the protocol and firmware a rejecting Passport reported, if it did.
  constructor(code, device = null) {
    super(code);
    this.name = 'HttpTransportError';
    this.code = code;
    this.device = device;
  }
}

function createHttpTransport(fetchFn) {
  let code = '';
  async function request(path, body) {
    let response;
    try {
      response = await fetchFn(path, {
        method: body ? 'POST' : 'GET',
        cache: 'no-store',
        credentials: 'omit',
        headers: {
          'X-AIQ-Access': code,
          ...(body ? { 'Content-Type': 'application/json' } : {}),
        },
        ...(body ? { body: JSON.stringify(body) } : {}),
      });
    } catch {
      throw new HttpTransportError('http_unreachable');
    }
    let data = null;
    try {
      data = await response.json();
    } catch {
      /* the body is not JSON */
    }
    if (!response.ok || data?.ok === false) {
      const rejection = data?.error_code ?? data?.error ?? 'request_failed';
      throw new HttpTransportError(
        `device_${rejection}`,
        data ? { protocol: data.protocol, firmware: data.firmware } : null,
      );
    }
    if (!data || typeof data !== 'object') throw new HttpTransportError('http_bad_response');
    return data;
  }
  return {
    kind: 'http',
    supported: true,
    setCode(value) {
      code = value;
    },
    hasSession: () => code !== '',
    openPort: async () => {},
    openSession: () => request('/api/state'),
    stateGet: () => request('/api/state'),
    command: (body) => request('/api/command', body),
    jobProvesAdmission: () => false,
    sessionLost() {
      code = '';
    },
    async close() {
      code = '';
    },
  };
}

const encoder = new TextEncoder();
const REQUEST_ID = /^[a-f0-9]{8}$/;
const SESSION_ID = /^[a-f0-9]{32}$/;
const DEFAULT_LINE_BYTES = 32768;
// The setup protocol this page speaks, and the USB identity of a Passport.
const SERIAL_PROTOCOL = 3;
const SESSION_OPEN_TRY_MS = 1500;
const STATE_TRY_MS = 5000;
const PASSPORT_USB_FILTER = { usbVendorId: 0x303a, usbProductId: 0x1001 };

class DeviceSerialError extends Error {
  // `device` carries the protocol and firmware a rejecting Passport reported, if it did.
  constructor(code, diagnostics = {}, device = null) {
    super(code);
    this.name = 'DeviceSerialError';
    this.code = code;
    this.diagnostics = { ...diagnostics };
    this.device = device;
  }
}

function deviceError(result, diagnostics = {}) {
  return new DeviceSerialError(
    `device_${result.error_code ?? result.error ?? 'rejected'}`,
    diagnostics,
    {
      protocol: result.protocol,
      firmware: result.firmware,
    },
  );
}

function makeUsbRequestId() {
  const bytes = new Uint8Array(4);
  if (!globalThis.crypto?.getRandomValues) throw new DeviceSerialError('serial_crypto_unavailable');
  crypto.getRandomValues(bytes);
  return Array.from(bytes, (value) => value.toString(16).padStart(2, '0')).join('');
}

function startReader(port, { maxLineBytes = DEFAULT_LINE_BYTES } = {}) {
  if (!port.readable || !port.writable) throw new DeviceSerialError('serial_unavailable');
  const reader = port.readable.getReader();
  let writer;
  try {
    writer = port.writable.getWriter();
  } catch (error) {
    reader.releaseLock();
    throw error;
  }

  const diagnostics = {
    received_data: false,
    result_seen: false,
    matching_result_seen: false,
  };
  const pending = new Map();
  let stopped = false;
  let terminalError = null;

  const fail = (code) => {
    terminalError ??= new DeviceSerialError(code, diagnostics);
    for (const request of pending.values()) {
      clearTimeout(request.timer);
      request.reject(terminalError);
    }
    pending.clear();
  };

  const consumeLine = (line) => {
    const normalized = line.endsWith('\r') ? line.slice(0, -1) : line;
    if (!normalized.startsWith('@AIQ:')) return;
    let frame;
    try {
      frame = JSON.parse(normalized.slice(5));
    } catch {
      return;
    }
    if (!['result', 'state'].includes(frame?.op) || typeof frame.ok !== 'boolean') return;
    diagnostics.result_seen = true;
    const request = pending.get(frame.request_id);
    if (!request) return;
    diagnostics.matching_result_seen = true;
    pending.delete(frame.request_id);
    clearTimeout(request.timer);
    request.resolve(frame);
  };

  const pump = (async () => {
    const decoder = new TextDecoder();
    let line = '';
    let discarding = false;
    while (!stopped) {
      const { value, done } = await reader.read();
      if (done) {
        if (!stopped) fail('serial_closed');
        return;
      }
      if (value?.byteLength) diagnostics.received_data = true;
      const text = decoder.decode(value, { stream: true });
      let start = 0;
      for (let index = 0; index <= text.length; index += 1) {
        if (index !== text.length && text[index] !== '\n') continue;
        const ended = index < text.length;
        if (!discarding) {
          const fragment = text.slice(start, index);
          if (encoder.encode(line + fragment).byteLength > maxLineBytes) {
            line = '';
            discarding = true;
          } else {
            line += fragment;
            if (ended) {
              consumeLine(line);
              line = '';
            }
          }
        }
        if (ended) discarding = false;
        start = index + 1;
      }
    }
  })().catch(() => {
    if (!stopped) fail('serial_read_error');
  });

  return {
    async send(
      frameBytes,
      requestId,
      { timeoutMs = 15000, onWritten, fatalWriteTimeout = true } = {},
    ) {
      if (!(frameBytes instanceof Uint8Array)) frameBytes = new Uint8Array(frameBytes);
      if (frameBytes.byteLength > 4096) throw new DeviceSerialError('frame_too_long', diagnostics);
      if (!REQUEST_ID.test(requestId ?? ''))
        throw new DeviceSerialError('serial_invalid_request_id', diagnostics);
      if (terminalError) throw terminalError;
      if (pending.has(requestId)) throw new DeviceSerialError('serial_request_busy', diagnostics);

      let resolve;
      let reject;
      const response = new Promise((res, rej) => {
        resolve = res;
        reject = rej;
      });
      const current = { resolve, reject, timer: null, writePending: true };
      pending.set(requestId, current);

      current.timer = setTimeout(() => {
        pending.delete(requestId);
        const error = new DeviceSerialError(
          current.writePending ? 'serial_write_timeout' : 'serial_timeout',
          diagnostics,
        );
        // A write that stays blocked is fatal unless the caller can live with it: the Passport
        // does not read the port while its USB setting is closed, so it is not a broken link.
        if (current.writePending && fatalWriteTimeout) terminalError ??= error;
        current.timedOut = true;
        reject(error);
      }, timeoutMs);
      const write = writer.write(frameBytes).then(
        () => {
          current.writePending = false;
          onWritten?.();
          return current.timedOut ? undefined : response;
        },
        () => {
          current.writePending = false;
          pending.delete(requestId);
          clearTimeout(current.timer);
          throw new DeviceSerialError('serial_write_error', diagnostics);
        },
      );
      return Promise.race([write, response]);
    },
    async close() {
      stopped = true;
      fail('serial_closed');
      try {
        await reader.cancel();
      } catch {
        /* the device may have disconnected */
      }
      await pump;
      try {
        reader.releaseLock();
      } catch {
        /* already released */
      }
      try {
        await Promise.race([writer.abort(), new Promise((resolve) => setTimeout(resolve, 250))]);
      } catch {
        /* the device may have disconnected */
      }
      try {
        writer.releaseLock();
      } catch {
        /* already released */
      }
    },
  };
}

async function openPort(port) {
  let readerSession;
  let opened = false;
  let closePromise;
  const close = () =>
    (closePromise ??= (async () => {
      await readerSession?.close();
      if (opened) {
        opened = false;
        try {
          await port.close();
        } catch {
          /* disconnected already */
        }
      }
    })());
  try {
    await port.open({ baudRate: 115200, bufferSize: 4096, flowControl: 'none' });
    opened = true;
    readerSession = startReader(port);
    await port.setSignals({ dataTerminalReady: false, requestToSend: false });
    return {
      async send(frameBytes, requestId, options) {
        try {
          return await readerSession.send(frameBytes, requestId, options);
        } catch (error) {
          if (error?.code === 'serial_write_timeout' && options?.fatalWriteTimeout !== false)
            void close();
          throw error;
        }
      },
      close,
    };
  } catch (error) {
    await close();
    throw error;
  }
}

function startDeviceSerial(port, requestId) {
  if (!REQUEST_ID.test(requestId ?? '')) throw new DeviceSerialError('serial_invalid_request_id');
  const session = startReader(port);
  return {
    send: (frameBytes, options) => session.send(frameBytes, requestId, options),
    close: session.close,
  };
}

// The primary settings page opens this once before the user starts the device's
// physical USB Settings window. The same port remains open for session_open.
async function openUsbDeviceSession(port, options = {}) {
  const serial = await openPort(port);
  return new UsbDeviceSession(serial, options);
}

class UsbDeviceSession {
  constructor(serial, { requestId = makeUsbRequestId, now = () => Date.now() } = {}) {
    this.serial = serial;
    this.requestId = requestId;
    this.now = now;
    this.openerId = this.requestId();
    this.sessionId = '';
    this.sessionExpiresAt = 0;
    this.limits = null;
    this.pendingMutation = null;
    this.closed = false;
  }

  // Forget the session. With `sameOpener` the next session_open carries the same request id: a
  // Passport that did not restart gives the same session back, one that did has no opener yet.
  resetSession({ sameOpener = false } = {}) {
    if (this.closed) throw new DeviceSerialError('serial_closed');
    if (!sameOpener) this.openerId = this.requestId();
    this.sessionId = '';
    this.sessionExpiresAt = 0;
    this.limits = null;
    this.pendingMutation = null;
  }

  async exchange(
    frame,
    {
      timeoutMs = 15000,
      retryOnce = false,
      maxFrameBytes = 4096,
      onWritten,
      fatalWriteTimeout = true,
    } = {},
  ) {
    const encoded = encoder.encode(`@AIQ:${JSON.stringify(frame)}\n`);
    if (encoded.byteLength > maxFrameBytes) throw new DeviceSerialError('frame_too_long');
    const send = () =>
      this.serial.send(encoded, frame.request_id, { timeoutMs, onWritten, fatalWriteTimeout });
    try {
      return await send();
    } catch (error) {
      if (!retryOnce || error?.code !== 'serial_timeout' || this.closed) throw error;
      return send();
    }
  }

  // The Passport answers only while its USB setting is open, so a try that gets no answer within
  // `timeoutMs` just means "not open yet"; the caller tries again.
  async openSession({ timeoutMs = SESSION_OPEN_TRY_MS } = {}) {
    if (this.closed) throw new DeviceSerialError('serial_closed');
    if (this.sessionId) return { session_id: this.sessionId, ...this.limits };
    // A write that is still blocked has not reached the Passport: do not queue another behind it.
    if (this.openWriting) throw new DeviceSerialError('serial_timeout', { write_pending: true });
    this.openWriting = true;
    const result = await this.exchange(
      { v: SERIAL_PROTOCOL, op: 'session_open', request_id: this.openerId },
      {
        timeoutMs,
        fatalWriteTimeout: false,
        onWritten: () => {
          this.openWriting = false;
        },
      },
    ).catch((error) => {
      if (error?.code === 'serial_write_error') this.openWriting = false;
      throw error;
    });
    if (!result.ok) throw deviceError(result);
    if (
      !SESSION_ID.test(result.session_id ?? '') ||
      !Number.isInteger(result.remaining_seconds) ||
      result.remaining_seconds <= 0 ||
      !Number.isInteger(result.max_command_bytes) ||
      !Number.isInteger(result.max_frame_bytes) ||
      !Number.isInteger(result.max_state_bytes)
    ) {
      throw new DeviceSerialError('usb_invalid_session_response');
    }
    this.sessionId = result.session_id;
    this.protocol = result.protocol;
    this.firmware = result.firmware;
    this.sessionExpiresAt = this.now() + result.remaining_seconds * 1000;
    this.limits = {
      remaining_seconds: result.remaining_seconds,
      max_command_bytes: Math.min(result.max_command_bytes, 2048),
      max_frame_bytes: Math.min(result.max_frame_bytes, 4096),
      max_state_bytes: Math.min(result.max_state_bytes, 16384),
    };
    return {
      session_id: this.sessionId,
      protocol: this.protocol,
      firmware: this.firmware,
      ...this.limits,
    };
  }

  assertSession(result) {
    if (result.session_id !== this.sessionId)
      throw new DeviceSerialError('usb_invalid_session_response');
  }

  assertSessionNotExpired() {
    if (this.sessionId && this.now() >= this.sessionExpiresAt)
      throw new DeviceSerialError('device_session_expired');
  }

  async stateGet() {
    if (!this.sessionId) throw new DeviceSerialError('usb_session_not_open');
    this.assertSessionNotExpired();
    // A busy Passport reads late: a write that is still blocked is not repeated behind itself, and
    // a blocked write is not a broken link.
    if (this.stateWriting) throw new DeviceSerialError('serial_timeout', { write_pending: true });
    this.stateWriting = true;
    const result = await this.exchange(
      {
        v: SERIAL_PROTOCOL,
        op: 'state_get',
        request_id: this.requestId(),
        session_id: this.sessionId,
      },
      {
        timeoutMs: STATE_TRY_MS,
        maxFrameBytes: this.limits.max_frame_bytes,
        fatalWriteTimeout: false,
        onWritten: () => {
          this.stateWriting = false;
        },
      },
    ).catch((error) => {
      if (error?.code === 'serial_write_error') this.stateWriting = false;
      throw error;
    });
    if (!result.ok) throw deviceError(result);
    this.assertSession(result);
    if (!result.state || typeof result.state !== 'object' || Array.isArray(result.state))
      throw new DeviceSerialError('usb_invalid_state');
    const stateBytes = encoder.encode(JSON.stringify(result.state)).byteLength;
    if (stateBytes > this.limits.max_state_bytes)
      throw new DeviceSerialError('usb_state_too_large');
    const seconds = result.state.session?.remaining_seconds;
    if (Number.isInteger(seconds) && seconds >= 0)
      this.sessionExpiresAt = this.now() + seconds * 1000;
    if (
      this.pendingMutation &&
      this.jobProvesAdmission(result.state, this.pendingMutation.requestId)
    )
      this.pendingMutation = null;
    return result.state;
  }

  jobProvesAdmission(state, requestId) {
    return (
      (state.jobs ?? []).some((job) => job.request_id === requestId) ||
      state.operation?.request_id === requestId
    );
  }

  async mutation(frame) {
    if (this.closed) throw new DeviceSerialError('serial_closed');
    if (!this.sessionId) throw new DeviceSerialError('usb_session_not_open');
    this.assertSessionNotExpired();
    if (this.pendingMutation) throw new DeviceSerialError('usb_mutation_unresolved');
    if (!REQUEST_ID.test(frame.request_id ?? ''))
      throw new DeviceSerialError('serial_invalid_request_id');
    const bodyBytes = encoder.encode(JSON.stringify(frame.body)).byteLength;
    if (bodyBytes > this.limits.max_command_bytes)
      throw new DeviceSerialError('usb_command_too_large');
    const packet = {
      v: SERIAL_PROTOCOL,
      op: frame.op,
      request_id: frame.request_id,
      session_id: this.sessionId,
      body: frame.body,
    };
    const pending = { requestId: frame.request_id, sessionId: this.sessionId };
    this.pendingMutation = pending;
    const remainingMs = () => Math.max(0, this.sessionExpiresAt - this.now());
    // onTransmit fires only once a frame has been written to the port; a rejection before that
    // never reached the device.
    const send = (timeoutMs) =>
      this.exchange(packet, {
        timeoutMs,
        maxFrameBytes: this.limits.max_frame_bytes,
        onWritten: frame.onTransmit,
      });
    let result;
    let retried = false;
    try {
      result = await send(Math.min(90000, remainingMs()));
    } catch (error) {
      if (
        error?.code !== 'serial_timeout' ||
        this.closed ||
        pending.sessionId !== this.sessionId ||
        remainingMs() <= 0
      ) {
        throw error;
      }
      retried = true;
      try {
        result = await send(Math.min(90000, remainingMs()));
      } catch {
        throw new DeviceSerialError('usb_uncertain_receipt', { retry_used: true });
      }
    }
    if (!result.ok) {
      this.pendingMutation = null;
      // retry_used: a rejection after a resend may answer the resend while the first write was
      // already processed.
      throw deviceError(result, { retry_used: retried });
    }
    this.assertSession(result);
    if (result.accepted !== true || result.request_id !== frame.request_id) {
      throw new DeviceSerialError('usb_invalid_mutation_ack');
    }
    this.pendingMutation = null;
    return result;
  }

  command(body) {
    return this.mutation({ op: 'command', request_id: body.request_id, body });
  }

  async close() {
    if (this.closed) return;
    this.closed = true;
    this.sessionId = '';
    this.pendingMutation = null;
    await this.serial.close();
  }
}

function serialErrorMessage(error) {
  if (
    ['serial_timeout', 'usb_uncertain_receipt', 'usb_mutation_unresolved'].includes(error?.code)
  ) {
    if (error.code === 'serial_timeout') {
      const flags = error.diagnostics;
      if (!flags?.received_data)
        return '没有收到 Passport 的回应。请确认 USB 线已连接，并在 Passport 上打开了 USB 设置。';
      if (flags.result_seen) return 'Passport 回复了，但没有匹配的确认。请重新读取状态。';
      return '收到了 USB 信息，但没有确认。请重新读取状态。';
    }
    return (
      'Passport 是否收到这次操作还不确定。页面不会再发送新的修改；请重新读取状态，' +
      '或断开 USB 后重新打开 USB 设置。'
    );
  }
  if (['serial_read_error', 'serial_write_error', 'serial_closed'].includes(error?.code))
    return 'USB 连接中断。请关闭占用设备的串口工具，重新插拔 USB 线后重试。';
  const rejected = {
    frame_too_long: '配置内容超过设备协议允许的大小。',
    session_busy: '另一个设置页面刚刚连接了 Passport。请关闭另一个页面，或等待数秒后重试。',
    invalid_session: '已在另一个页面继续设置，或 USB 设置已重新打开。请重新连接。',
    session_expired:
      'USB 设置还没有打开，或设置时间已到。' +
      '请在 Passport 上：长按 OK，按下键，再按 OK，然后重新连接。',
  };
  if (error?.code?.startsWith('device_'))
    return (
      rejected[error.code.slice(7)] ?? '设备收到配置，但拒绝了此次请求。请重新打开 USB 设置后重试。'
    );
  return null;
}

// The USB transport of the setup page. Opening the port may restart the Passport, so the page opens
// it first and the user opens the Passport's USB setting afterwards; the session is then tried
// again and again until the Passport answers. The port stays open while the setting comes and goes.
function createSerialTransport(nav = globalThis.navigator) {
  let session = null;
  return {
    kind: 'serial',
    supported: Boolean(nav?.serial?.requestPort),
    hasPort: () => session !== null,
    hasSession: () => Boolean(session?.sessionId),
    async openPort() {
      if (session) return;
      const port = await nav.serial.requestPort({ filters: [PASSPORT_USB_FILTER] });
      session = await openUsbDeviceSession(port);
    },
    // One try: it fails with serial_timeout or device_session_expired while the setting is closed.
    openSession: () => session.openSession(),
    // The Passport ended the session, restarted, or another page took over: keep the port.
    sessionLost({ sameOpener = false } = {}) {
      session?.resetSession?.({ sameOpener });
    },
    stateGet: () => session.stateGet(),
    command: (body) => session.command(body),
    jobProvesAdmission: (state, requestId) => session?.jobProvesAdmission(state, requestId),
    async close() {
      const closing = session;
      session = null;
      if (closing) await closing.close();
    },
  };
}

// ---------------------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------------------

const app = {
  transport: null,
  blocked: null, // 'firmware_old' | 'page_old' | 'unsupported_browser'
  blockedProtocol: 0,
  connected: false,
  connecting: false,
  waiting: false, // USB port open, waiting for the Passport's USB setting to be opened
  saving: null, // the row a change is being saved for: { type, id }
  closing: false, // the hotspot is about to close
  ended: false, // the session ended; a new one needs the Passport
  state: null,
  stateAt: 0,
  busy: false,
  polling: false,
  silentSince: 0, // since when the Passport has answered no state read
  lastPollAt: 0,
  validateJob: '',
  expanded: null, // { type: 'account' | 'network', id }
  removing: null, // { type, id }
  removeTimer: 0,
  wifiForm: null, // { index } while the Wi‑Fi form is open (index -1 adds)
  sheet: null, // 'codex' | 'deepseek' while the add-account sheet is open
  notice: null, // { text, kind, action }
  summary: '',
  drafts: new Map(), // what the user typed into the row editors
  inputs: new Map(), // the editor inputs of the current rows, by draft name
  focus: '',
  signature: '',
};

// ---------------------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------------------

function h(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === undefined || value === null || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key === 'html') node.innerHTML = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (['type', 'value', 'disabled', 'hidden', 'checked', 'id'].includes(key))
      node[key] = value;
    else node.setAttribute(key, value === true ? '' : String(value));
  }
  node.append(...children.flat().filter((child) => child !== null && child !== undefined));
  return node;
}

function newRequestId() {
  const data = new Uint8Array(4);
  if (globalThis.crypto?.getRandomValues) crypto.getRandomValues(data);
  else for (let i = 0; i < 4; i += 1) data[i] = Math.floor(Math.random() * 256);
  return Array.from(data, (x) => x.toString(16).padStart(2, '0')).join('');
}

// Crockford Base32: upper case, I and L read as 1, O as 0, no U.
function normalizeAccessCode(value) {
  const digits = String(value)
    .toUpperCase()
    .replace(/[IL]/g, '1')
    .replace(/O/g, '0')
    .replace(/[^0-9A-TV-Z]/g, '')
    .slice(0, 16);
  return digits.match(/.{1,4}/g)?.join('-') ?? '';
}

// The rules below are the Passport's own; the page says so before the Passport has to.
function textProblem(value, { min = 0, max, what }) {
  const length = textBytes(value);
  // eslint-disable-next-line no-control-regex
  if (/[\u0000-\u001f\u007f]/.test(value)) return `${what}不能包含控制字符`;
  if (length < min) return `${what}不能为空`;
  if (length > max) return `${what}最多 ${max} 个字节（一个汉字约 3 个字节）`;
  return '';
}
const labelProblem = (label, required) =>
  textProblem(label, { min: required ? 1 : 0, max: 32, what: '备注名' });
const ssidProblem = (ssid) => textProblem(ssid, { min: 1, max: 32, what: 'Wi‑Fi 名称' });
const keyProblem = (key) => textProblem(key, { min: 1, max: 511, what: '密钥' });
// 8 to 63 bytes, or exactly 64 hexadecimal digits (a raw WPA2 key); empty means an open network.
function wifiPasswordProblem(password) {
  if (password === '') return '';
  const length = textBytes(password);
  const control = textProblem(password, { max: 64, what: '密码' });
  if (control && !control.includes('最多')) return control;
  if (length < 8 || length > 64)
    return 'Wi‑Fi 密码须为 8 至 63 个字节（一个汉字约 3 个字节），或恰好 64 位十六进制密钥';
  if (length === 64 && !/^[0-9a-fA-F]{64}$/.test(password))
    return '64 个字节的密码必须是 64 位十六进制密钥；普通密码请用 8 至 63 个字节';
  return '';
}

function failureText(error) {
  const code = String(error?.code ?? '');
  const device = code.startsWith('device_') ? code.slice(7) : code;
  return (
    MESSAGES[device] ??
    serialErrorMessage(error) ??
    (error?.jobError ? '操作没有完成，请重试' : 'Passport 没有完成这次操作，请重试')
  );
}

// What a Passport that does not speak protocol 3 looks like: no `protocol`, or an older one.
function protocolProblem(device) {
  const protocol = device?.protocol;
  if (typeof protocol !== 'number' || protocol < PROTOCOL) return 'firmware_old';
  return protocol > PROTOCOL ? 'page_old' : null;
}

const PAGES_URL = 'https://zesming.github.io/ai-passport-quota/';

function matchingPageUrl(protocol) {
  if (location.protocol === 'file:') return `${PAGES_URL}p${protocol}/`;
  const base = location.pathname.replace(/(?:p\d+\/)?(?:index\.html)?$/, '');
  return `${location.origin}${base.endsWith('/') ? base : `${base}/`}p${protocol}/`;
}

// ---------------------------------------------------------------------------------------
// Derived values
// ---------------------------------------------------------------------------------------

const networksOf = (state) => state?.network?.saved_networks ?? [];
const accountsOf = (state) => state?.accounts ?? [];
const pendingOf = (item) => (item.validation ?? 'ok') === 'pending';
const failedOf = (item) => (item.validation ?? 'ok') === 'failed';

function jobOf(id) {
  return (app.state?.jobs ?? []).find((job) => job.request_id === id);
}
const jobDone = (job) => job?.status === 'succeeded' || job?.status === 'failed';

function validating() {
  if (app.state?.validating) return true;
  return Boolean(app.validateJob) && !jobDone(jobOf(app.validateJob));
}

function remainingSeconds() {
  const left = app.state?.session?.remaining_seconds;
  if (!Number.isFinite(left)) return null;
  return Math.max(0, Math.ceil(left - (Date.now() - app.stateAt) / 1000));
}

function countsOf(state) {
  const items = [...networksOf(state), ...accountsOf(state)];
  return { pending: items.filter(pendingOf).length, failed: items.filter(failedOf).length };
}

function interactive() {
  return app.connected && !app.blocked && !app.busy && !validating() && !app.closing;
}

// ---------------------------------------------------------------------------------------
// Notices
// ---------------------------------------------------------------------------------------

function say(text, kind = '', action = null) {
  app.notice = text ? { text, kind, action } : null;
  renderNotice();
}

function renderNotice() {
  const notice = app.notice;
  byId('notice').hidden = !notice;
  byId('notice').className = `notice ${notice?.kind ?? ''}`;
  byId('notice-text').textContent = notice?.text ?? '';
  const action = byId('notice-action');
  action.hidden = !notice?.action;
  action.textContent = notice?.action?.label ?? '';
  action.onclick = notice?.action?.run ?? null;
}

// ---------------------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------------------

function chip(validation) {
  const [text, kind] = {
    saved: ['已保存', 'saved'],
    ok: ['正常', 'ok'],
    pending: ['待验证', 'pending'],
  }[validation] ?? ['验证失败', 'failed'];
  return h('span', { class: `chip ${kind}`, text });
}

// While a change is being saved the row says so instead of showing its state.
function rowChip(type, id, validation) {
  const saving = app.saving?.type === type && app.saving.id === id;
  return saving ? h('span', { class: 'chip', text: '保存中…' }) : chip(validation);
}

function field(name, label, props = {}) {
  const input = h('input', {
    ...props,
    value: app.drafts.get(name) ?? props.value ?? '',
    oninput: (event) => app.drafts.set(name, event.target.value),
    onfocus: () => {
      app.focus = name;
    },
    onblur: () => {
      if (app.focus === name) app.focus = '';
    },
  });
  app.inputs.set(name, input);
  return h('label', { class: 'field' }, h('span', { text: label }), input);
}

function errorLine(item, kind) {
  if (!failedOf(item) || !item.error_code) return null;
  const known = MESSAGES[item.error_code] ?? '验证没有通过';
  let hint = '';
  if (kind === 'network')
    hint = app.transport.kind === 'http' ? `，${HOTSPOT_WIFI_RECOVERY}` : `，${WIFI_RECOVERY}`;
  return h('p', { class: 'row-error', text: known + hint });
}

function accountTitle(account) {
  return account.label || (account.provider === 'deepseek' ? 'DeepSeek' : 'ChatGPT');
}

function accountSub(account) {
  if (account.provider === 'deepseek') return 'DeepSeek';
  return account.email || 'ChatGPT';
}

function accountValue(account) {
  if (account.provider === 'deepseek') {
    const cny = account.balance?.balance_infos?.find((info) => info.currency === 'CNY');
    return cny ? `余额 ¥${cny.total_balance}` : '';
  }
  return [
    ['five_hour', '5 小时额度'],
    ['seven_day', '7 天额度'],
  ]
    .filter(([key]) => account[key]?.present && typeof account[key].remaining_percent === 'number')
    .map(([key, name]) => `${name} 剩余 ${account[key].remaining_percent}%`)
    .join(' · ');
}

function toggle(type, id) {
  const same = app.expanded?.type === type && app.expanded.id === id;
  app.expanded = same ? null : { type, id };
  app.removing = null;
  clearDrafts();
  render(true);
}

function removeButton(type, id, run) {
  const confirming = app.removing?.type === type && app.removing.id === id;
  return h('button', {
    class: `danger${confirming ? ' confirm' : ''}`,
    type: 'button',
    text: confirming ? '确认移除' : '移除',
    disabled: !interactive(),
    onclick: () => {
      if (!confirming) {
        app.removing = { type, id };
        clearTimeout(app.removeTimer);
        app.removeTimer = setTimeout(() => {
          app.removing = null;
          render(true);
        }, REMOVE_CONFIRM_MS);
        render(true);
        return;
      }
      clearTimeout(app.removeTimer);
      app.removing = null;
      void run();
    },
  });
}

function accountDetail(account) {
  const locked = !interactive();
  const pieces = [errorLine(account, 'account')];
  if (account.provider === 'deepseek') {
    pieces.push(
      field(`label:${account.id}`, '备注名', { value: account.label ?? '', maxlength: 32 }),
      field(`key:${account.id}`, '新密钥（不改密钥就留空）', {
        type: 'password',
        autocomplete: 'new-password',
        autocapitalize: 'none',
        spellcheck: 'false',
      }),
      h(
        'div',
        { class: 'actions' },
        h('button', {
          class: 'primary',
          type: 'button',
          text: '保存',
          disabled: locked,
          onclick: () => void saveDeepseek(account),
        }),
        removeButton('account', account.id, () => removeAccount(account)),
      ),
    );
  } else {
    const queued = account.validation === 'pending';
    pieces.push(
      queued ? h('p', { class: 'muted', text: '点“完成设置”后，在 Passport 上完成授权' }) : null,
      h(
        'div',
        { class: 'actions' },
        queued
          ? null
          : h('button', {
              type: 'button',
              text: '重新授权',
              disabled:
                locked ||
                accountsOf(app.state).some((item) => item.provider === 'codex' && pendingOf(item)),
              onclick: () => void queueCodex(account),
            }),
        removeButton('account', account.id, () => removeAccount(account)),
      ),
    );
  }
  return h('div', { class: 'detail' }, ...pieces);
}

function accountRow(account) {
  const open = app.expanded?.type === 'account' && app.expanded.id === account.id;
  const value = accountValue(account);
  return h(
    'li',
    { class: 'row' },
    h(
      'button',
      {
        class: 'row-main',
        type: 'button',
        'aria-expanded': open ? 'true' : 'false',
        onclick: () => toggle('account', account.id),
      },
      h('span', { class: 'logo', html: LOGOS[account.provider] ?? '' }),
      h(
        'span',
        { class: 'row-text' },
        h('span', { class: 'row-title', text: accountTitle(account) }),
        h('span', { class: 'row-sub', text: accountSub(account) }),
        value ? h('span', { class: 'row-sub', text: value }) : null,
      ),
      rowChip('account', account.id, account.validation),
      h('span', { class: 'chevron', text: open ? '⌄' : '›' }),
    ),
    open ? accountDetail(account) : null,
  );
}

function networkDetail(network) {
  return h(
    'div',
    { class: 'detail' },
    errorLine(network, 'network'),
    h(
      'div',
      { class: 'actions' },
      h('button', {
        type: 'button',
        text: '修改',
        disabled: !interactive(),
        onclick: () => openWifiForm(network),
      }),
      removeButton('network', String(network.index), () => removeNetwork(network)),
    ),
  );
}

function networkRow(network) {
  const open = app.expanded?.type === 'network' && app.expanded.id === String(network.index);
  return h(
    'li',
    { class: 'row' },
    h(
      'button',
      {
        class: 'row-main',
        type: 'button',
        'aria-expanded': open ? 'true' : 'false',
        onclick: () => toggle('network', String(network.index)),
      },
      h(
        'span',
        { class: 'row-text' },
        h('span', { class: 'row-title', text: network.ssid }),
        network.selected && ['ok', 'saved'].includes(network.validation)
          ? h('span', { class: 'row-sub', text: '正在使用' })
          : null,
      ),
      rowChip('network', String(network.index), network.validation),
      h('span', { class: 'chevron', text: open ? '⌄' : '›' }),
    ),
    open ? networkDetail(network) : null,
  );
}

function restoreFocus() {
  const target = app.inputs.get(app.focus);
  if (target) {
    target.focus();
    target.setSelectionRange?.(target.value.length, target.value.length);
  }
}

function renderConnection() {
  const transport = app.transport;
  const serial = transport.kind === 'serial';
  const dot = byId('conn-dot');
  const text = byId('conn-text');
  const help = byId('conn-help');
  dot.className = 'dot';
  help.hidden = true;
  byId('conn-steps').hidden = true;
  byId('code-form').hidden = true;
  byId('usb-connect').hidden = true;
  byId('usb-disconnect').hidden = true;
  if (app.blocked === 'unsupported_browser') {
    text.textContent = '请用桌面版 Chrome 或 Edge 打开';
    help.hidden = false;
    help.textContent = '其他浏览器暂时不能通过 USB 设置 Passport。';
  } else if (app.connected) {
    dot.className = 'dot on';
    text.textContent = serial ? '已连接（USB）' : '已连接（热点）';
    byId('usb-disconnect').hidden = !serial;
  } else if (app.waiting) {
    dot.className = 'dot spin';
    text.textContent = '请在 Passport 上打开 USB 设置';
    help.hidden = false;
    help.textContent = 'USB 线已连上。Passport 的 USB 设置一打开，页面会自动连接。';
    byId('usb-disconnect').hidden = false;
    byId('usb-disconnect').textContent = '取消';
  } else if (app.connecting) {
    dot.className = 'dot spin';
    text.textContent = '连接中…';
  } else if (app.closing) {
    text.textContent = '热点即将关闭';
  } else if (serial) {
    text.textContent = app.ended ? '设置时间已到' : '未连接';
    byId('conn-steps').hidden = false;
    byId('usb-connect').hidden = false;
    byId('usb-connect').textContent = transport.hasPort() ? '重新连接' : '连接 Passport';
  } else {
    text.textContent = app.ended ? '设置时间已到' : '未连接';
    byId('code-form').hidden = false;
  }
  if (app.connected) byId('usb-disconnect').textContent = '断开 USB';
}

// While connecting the lists show placeholders and nothing can be changed.
function renderSkeleton() {
  const placeholder = () =>
    h(
      'li',
      { class: 'row skeleton', 'aria-hidden': 'true' },
      h('span', { class: 'bar wide-bar' }),
      h('span', { class: 'bar' }),
    );
  byId('accounts-title').textContent = '账户';
  byId('wifi-title').textContent = 'Wi‑Fi';
  byId('accounts-hint').hidden = true;
  byId('accounts-empty').hidden = true;
  byId('wifi-empty').hidden = true;
  byId('wifi-form').hidden = true;
  byId('account-list').replaceChildren(placeholder(), placeholder());
  byId('wifi-list').replaceChildren(placeholder());
  for (const id of ['add-account', 'add-wifi', 'refresh-select', 'sleep-select'])
    byId(id).disabled = true;
}

function renderLists() {
  const state = app.state;
  const accounts = accountsOf(state);
  const networks = networksOf(state);
  const noWifi = networks.length === 0;
  const form = app.wifiForm !== null || noWifi;
  const accountsFull = accounts.length >= LIMITS.accounts;
  const networksFull = networks.length >= LIMITS.networks;
  byId('accounts-title').textContent = `账户 ${accounts.length}/${LIMITS.accounts}`;
  byId('wifi-title').textContent = `Wi‑Fi ${networks.length}/${LIMITS.networks}`;
  byId('accounts-section').className = `card${noWifi ? ' dim' : ''}`;
  byId('accounts-hint').hidden = !noWifi;
  byId('accounts-empty').hidden = accounts.length > 0 || noWifi;
  byId('accounts-empty').textContent = accountsFull ? '最多 8 个账户，请先移除一个' : '还没有账户';
  byId('wifi-empty').hidden = networks.length > 0;
  byId('add-account').disabled = !interactive() || noWifi || accountsFull;
  byId('add-account').title = accountsFull ? '最多 8 个账户，请先移除一个' : '';
  byId('add-wifi').disabled = !interactive() || networksFull;
  byId('add-wifi').title = networksFull ? '最多 3 个 Wi‑Fi，请先移除一个' : '';
  app.inputs.clear();
  byId('account-list').replaceChildren(...accounts.map(accountRow));
  byId('wifi-list').replaceChildren(...networks.map(networkRow));
  byId('wifi-form').hidden = !form;
  if (form) {
    const editing = app.wifiForm !== null && app.wifiForm.index >= 0;
    byId('wifi-cancel').hidden = noWifi && !editing;
    byId('wifi-save').disabled = !interactive();
    byId('wifi-ssid').disabled = !interactive();
    byId('wifi-password').disabled = !interactive();
  }
}

function renderSettings() {
  const settings = app.state?.settings ?? {};
  const refresh = byId('refresh-select');
  const screenOff = byId('sleep-select');
  refresh.value =
    settings.auto_refresh === false ? REFRESH_MANUAL : String(settings.refresh_seconds);
  screenOff.value = String(settings.screen_timeout_seconds ?? 120);
  refresh.disabled = screenOff.disabled = !interactive();
}

const STEP_TEXT = {
  wifi: '正在连接 Wi‑Fi…',
  deepseek: '正在验证 DeepSeek…',
  chatgpt: '请在 Passport 上完成 ChatGPT 授权',
};

function renderBar() {
  const serial = app.transport.kind === 'serial';
  const show = app.connected && !app.blocked && !app.closing;
  byId('bar').hidden = !show;
  if (!show) return;
  const { pending, failed } = countsOf(app.state);
  const running = validating();
  const authorizing = running && app.state?.validation_step === 'chatgpt';
  let text;
  if (running) text = STEP_TEXT[app.state?.validation_step] ?? '正在验证…';
  else if (pending || failed)
    text = [pending ? `有 ${pending} 项待验证` : '', failed ? `${failed} 项验证失败` : '']
      .filter(Boolean)
      .join('，');
  else text = '全部正常';
  if (!serial && !running) text += '。点“完成设置”后，Passport 会关闭热点并开始验证';
  byId('bar-text').textContent = text;
  const finish = byId('finish');
  finish.textContent = running ? '验证中…' : '完成设置';
  finish.disabled = !interactive() || (serial && pending + failed === 0);
  const cancel = byId('cancel-auth');
  cancel.hidden = !authorizing || !app.state?.operation?.cancelable;
  cancel.disabled = app.busy;
}

function renderSheet() {
  const kind = app.sheet;
  byId('sheet').hidden = !kind;
  byId('codex-form').hidden = kind !== 'codex';
  byId('deepseek-form').hidden = kind !== 'deepseek';
  byId('pick-codex').className = kind === 'codex' ? 'on' : '';
  byId('pick-deepseek').className = kind === 'deepseek' ? 'on' : '';
  const locked = !interactive();
  byId('codex-add').disabled = locked;
  byId('deepseek-add').disabled = locked;
}

function renderRemaining() {
  const left = remainingSeconds();
  const node = byId('remaining');
  node.hidden = left === null || !app.connected || app.closing;
  if (left !== null)
    node.textContent = `剩余 ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
}

function render(force = false) {
  renderConnection();
  renderRemaining();
  renderNotice();
  const content = app.connected && !app.blocked && Boolean(app.state);
  const loading = !content && !app.blocked && (app.connecting || app.waiting);
  byId('content').hidden = !content && !loading;
  byId('content').className = loading ? 'loading' : '';
  if (!content) {
    byId('bar').hidden = true;
    if (loading) {
      app.signature = '';
      renderSkeleton();
    }
    renderSheet();
    return;
  }
  const signature = JSON.stringify([
    app.state.accounts,
    app.state.network,
    app.state.settings,
    app.state.validating,
    app.state.validation_step,
    app.expanded,
    app.removing,
    app.wifiForm,
    app.busy,
    app.saving,
    app.closing,
    validating(),
  ]);
  if (force || signature !== app.signature) {
    app.signature = signature;
    renderLists();
    renderSettings();
    restoreFocus();
  }
  renderBar();
  renderSheet();
}

// ---------------------------------------------------------------------------------------
// Device traffic
// ---------------------------------------------------------------------------------------

function clearSecrets() {
  clearDrafts();
  for (const id of ['wifi-password', 'deepseek-key']) byId(id).value = '';
}

function block(reason, device = null) {
  app.blocked = reason;
  app.blockedProtocol = device?.protocol ?? 0;
  app.waiting = false;
  app.connected = false;
  app.connecting = false;
  app.state = null;
  clearSecrets();
  void app.transport.close();
  if (reason === 'firmware_old')
    say('Passport 固件过旧，请先升级固件', 'error', {
      label: '查看升级方法',
      run: () => window.open(README_URL, '_blank', 'noopener,noreferrer'),
    });
  else if (reason === 'page_old') {
    const url = matchingPageUrl(app.blockedProtocol);
    say(
      '设置页版本过旧',
      'error',
      url ? { label: '打开匹配的页面', run: () => window.open(url, '_self') } : null,
    );
  }
  render(true);
}

function endSession(text, { retry = false, sameOpener = false } = {}) {
  app.silentSince = 0;
  app.waiting = false;
  app.connected = false;
  app.connecting = false;
  app.ended = true;
  app.state = null;
  app.validateJob = '';
  clearSecrets();
  app.transport.sessionLost({ sameOpener });
  say(text, 'warn');
  render(true);
  if (retry) void waitForWindow();
}

// A rejection that ends the session, or the page's use of this Passport.
function handleFailure(error) {
  const code = String(error?.code ?? '');
  if (code === 'device_unsupported_version')
    return block(protocolProblem(error.device), error.device);
  if (code === 'device_session_expired') {
    // The USB setting runs out: the port stays open and the page waits for it to be opened again.
    if (app.transport.kind === 'serial')
      return endSession('设置时间已到。请在 Passport 上重新打开 USB 设置', { retry: true });
    return endSession('设置时间已到。在 Passport 上重新开启热点设置，再输入新的访问码');
  }
  if (code === 'device_invalid_session')
    return endSession('另一个页面接管了 Passport 的 USB 设置。要在这里继续，请点“重新连接”');
  if (code === 'device_access_locked' || code === 'device_unauthorized') {
    app.transport.sessionLost();
    app.waiting = false;
    app.connected = app.connecting = false;
    app.state = null;
    say(failureText(error), 'error');
    return render(true);
  }
  if (['serial_closed', 'serial_read_error', 'serial_write_timeout'].includes(code)) {
    app.waiting = false;
    app.connected = false;
    app.state = null;
    void app.transport.close();
    say(failureText(error), 'error');
    return render(true);
  }
  say(failureText(error), 'error');
  return undefined;
}

function acceptState(state) {
  const problem = protocolProblem(state);
  if (problem) {
    block(problem, state);
    return false;
  }
  const wasValidating = validating();
  app.state = state;
  app.stateAt = Date.now();
  if (app.validateJob && jobDone(jobOf(app.validateJob))) {
    const job = jobOf(app.validateJob);
    app.validateJob = '';
    if (wasValidating) announceResult(job);
  } else if (wasValidating && !validating()) announceResult(null);
  if (state.storage_error) say(MESSAGES[state.storage_error] ?? 'Passport 暂时不能保存', 'error');
  return true;
}

function announceResult(job) {
  const { pending, failed } = countsOf(app.state);
  const login = app.state?.login;
  if (job?.status === 'failed' && job.error_code && !failed)
    say(MESSAGES[job.error_code] ?? '验证没有完成', 'error');
  else if (failed) say(`${failed} 项验证失败。修改后再点“完成设置”`, 'error');
  else if (login?.error_code && login.state === 'failed')
    say(`ChatGPT：${MESSAGES[login.error_code] ?? '授权没有完成'}。可以再添加一次`, 'error');
  else if (pending) say(`还有 ${pending} 项待验证`, 'warn');
  else say('全部正常，可以断开 USB 了', '');
}

async function poll() {
  if (app.polling || !app.transport.hasSession() || app.closing) return false;
  app.polling = true;
  app.lastPollAt = Date.now();
  try {
    const state = await app.transport.stateGet();
    if (!app.transport.hasSession()) return false;
    app.silentSince = 0;
    const accepted = acceptState(state);
    if (accepted) render();
    return accepted;
  } catch (error) {
    const silent = ['serial_timeout', 'serial_write_timeout'].includes(error?.code);
    if (app.connected && app.transport.kind === 'serial' && silent) {
      // No answer: a busy Passport reads late. Only long silence means it restarted, and then the
      // same opener asks again: a Passport that did not restart gives the same session back.
      app.silentSince ||= Date.now();
      if (Date.now() - app.silentSince >= SILENT_RESTART_MS)
        endSession('Passport 可能重启了，请在 Passport 上打开 USB 设置', {
          retry: true,
          sameOpener: true,
        });
    } else if (app.connected) handleFailure(error);
    return false;
  } finally {
    app.polling = false;
  }
}

// Wait for the Passport to finish what a command asked for: errors such as account_limit are job
// results, not part of the acknowledgement.
async function waitForJob(id) {
  const until = Date.now() + JOB_WAIT_MS;
  while (Date.now() < until && app.connected) {
    await poll();
    const job = jobOf(id);
    if (job?.status === 'succeeded') return;
    if (job?.status === 'failed') {
      const failure = new Error(job.error_code);
      failure.code = `device_${job.error_code}`;
      failure.jobError = true;
      throw failure;
    }
    await sleep(250);
  }
  // No answer yet: the change may or may not have taken effect, so do not report success.
  if (app.connected) {
    const failure = new Error('job_timeout');
    failure.code = 'device_job_timeout';
    throw failure;
  }
}

async function send(op, fields = {}, { wait = true, target = null } = {}) {
  if (app.busy || !app.connected || app.closing) return null;
  const body = {
    v: PROTOCOL,
    request_id: newRequestId(),
    op,
    ...fields,
    phone_utc: Math.floor(Date.now() / 1000),
  };
  app.busy = true;
  app.saving = target;
  render(true);
  try {
    try {
      await app.transport.command(body);
    } catch (error) {
      // The write was sent but not acknowledged: the Passport's job list says whether it arrived.
      if (error?.code !== 'usb_uncertain_receipt') throw error;
      await poll();
      if (!app.transport.jobProvesAdmission(app.state, body.request_id)) throw error;
    }
    if (wait) await waitForJob(body.request_id);
    return body;
  } catch (error) {
    handleFailure(error);
    return null;
  } finally {
    app.busy = false;
    app.saving = null;
    render(true);
  }
}

// ---------------------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------------------

function clearDrafts(prefix = '') {
  for (const name of [...app.drafts.keys()]) if (name.startsWith(prefix)) app.drafts.delete(name);
}

async function saveWifi(event) {
  event.preventDefault();
  const ssid = byId('wifi-ssid').value;
  const password = byId('wifi-password').value;
  const problem = ssidProblem(ssid) || wifiPasswordProblem(password);
  const error = byId('wifi-error');
  error.hidden = !problem;
  error.textContent = problem;
  if (problem) return;
  const index = app.wifiForm?.index ?? -1;
  const sent = await send(
    'network_save',
    {
      ssid,
      password,
      open_network: password === '',
      ...(index >= 0 ? { network_index: index } : {}),
    },
    index >= 0 ? { target: { type: 'network', id: String(index) } } : {},
  );
  if (!sent) return;
  byId('wifi-password').value = '';
  byId('wifi-ssid').value = '';
  app.wifiForm = null;
  app.expanded = null;
  say('Wi‑Fi 已保存，待验证', '');
  render(true);
}

function openWifiForm(network = null) {
  app.wifiForm = { index: network ? network.index : -1 };
  byId('wifi-ssid').value = network?.ssid ?? '';
  byId('wifi-password').value = '';
  byId('wifi-error').hidden = true;
  render(true);
  byId('wifi-ssid').focus?.();
}

async function removeNetwork(network) {
  const sent = await send(
    'network_remove',
    { network_index: network.index },
    { target: { type: 'network', id: String(network.index) } },
  );
  if (sent) {
    app.expanded = null;
    say('已移除 Wi‑Fi', '');
  }
}

async function removeAccount(account) {
  const sent = await send(
    'account_remove',
    { account_id: account.id },
    { target: { type: 'account', id: account.id } },
  );
  if (sent) {
    app.expanded = null;
    clearDrafts(`label:${account.id}`);
    clearDrafts(`key:${account.id}`);
    say('已移除账户', '');
  }
}

async function saveDeepseek(account) {
  const label = (app.drafts.get(`label:${account.id}`) ?? account.label ?? '').trim();
  const key = (app.drafts.get(`key:${account.id}`) ?? '').trim();
  const problem = labelProblem(label, true) || (key ? keyProblem(key) : '');
  if (problem) return say(problem, 'error');
  const sent = await send(
    'deepseek_save',
    {
      account_id: account.id,
      label,
      ...(key ? { api_key: key } : {}),
    },
    { target: { type: 'account', id: account.id } },
  );
  if (sent) {
    clearDrafts(`key:${account.id}`);
    clearDrafts(`label:${account.id}`);
    say(key ? '新密钥已保存，待验证' : '备注名已保存', '');
    render(true);
  }
  return undefined;
}

async function queueCodex(account) {
  const sent = await send(
    'codex_queue',
    { account_id: account.id, label: account.label ?? '' },
    { target: { type: 'account', id: account.id } },
  );
  if (sent) say('点“完成设置”后，在 Passport 上完成授权', '');
}

async function addCodex(event) {
  event.preventDefault();
  const label = byId('codex-label').value.trim();
  const problem = labelProblem(label, false);
  if (problem) return say(problem, 'error');
  const sent = await send('codex_queue', { label });
  if (sent) {
    closeSheet();
    say('已添加 ChatGPT。点“完成设置”后，在 Passport 上完成授权', '');
  }
  return undefined;
}

async function addDeepseek(event) {
  event.preventDefault();
  const label = byId('deepseek-label').value.trim();
  const key = byId('deepseek-key').value.trim();
  const problem = labelProblem(label, true) || keyProblem(key);
  const error = byId('deepseek-error');
  error.hidden = !problem;
  error.textContent = problem;
  if (problem) return undefined;
  const sent = await send('deepseek_save', { label, api_key: key });
  if (sent) {
    closeSheet();
    say('密钥已保存，待验证', '');
  }
  return undefined;
}

function openSheet(kind) {
  app.sheet = kind;
  byId('deepseek-error').hidden = true;
  renderSheet();
  (kind === 'codex' ? byId('codex-label') : byId('deepseek-label')).focus?.();
}

function closeSheet() {
  app.sheet = null;
  for (const id of ['codex-label', 'deepseek-label', 'deepseek-key']) byId(id).value = '';
  byId('deepseek-key').type = 'password';
  byId('deepseek-show').checked = false;
  renderSheet();
}

async function saveSettings() {
  const mode = byId('refresh-select').value;
  const current = app.state?.settings ?? {};
  await send('settings_save', {
    auto_refresh: mode !== REFRESH_MANUAL,
    refresh_seconds: mode === REFRESH_MANUAL ? current.refresh_seconds || 300 : Number(mode),
    screen_timeout_seconds: Number(byId('sleep-select').value),
  });
}

async function finish() {
  if (!interactive()) return;
  if (app.transport.kind === 'http') {
    const sent = await send('setup_close', {}, { wait: false });
    if (!sent) return;
    app.closing = true;
    say('热点即将关闭，请看 Passport 屏幕上的结果。手机会自动断开。', '');
    app.state = null;
    render(true);
    return;
  }
  const sent = await send('validate', {}, { wait: false });
  if (!sent) return;
  app.validateJob = sent.request_id;
  say('', '');
  render(true);
  await poll(); // show the first step at once
}

async function cancelAuthorization() {
  const id = app.state?.operation?.request_id;
  if (!id || app.busy) return;
  await send('operation_cancel', { target_request_id: id }, { wait: false });
}

// ---------------------------------------------------------------------------------------
// Connecting
// ---------------------------------------------------------------------------------------

// Step 1: choose the port and open it. This may restart the Passport, which is why its USB setting
// is opened only afterwards.
async function connectSerial() {
  if (app.connecting || app.connected || app.waiting) return;
  app.ended = false;
  say('', '');
  if (!app.transport.hasPort()) {
    app.connecting = true;
    render(true);
    try {
      await app.transport.openPort();
    } catch (error) {
      app.connecting = false;
      if (error?.name === 'NotFoundError' || error?.name === 'AbortError')
        say('没有选择设备', 'warn');
      else if (error?.name === 'InvalidStateError') say(MESSAGES.serial_busy, 'error');
      else handleFailure(error);
      render(true);
      return;
    }
    app.connecting = false;
  }
  await waitForWindow();
}

// Step 2: ask for a session every 1.5 seconds until the Passport's USB setting is open.
async function waitForWindow() {
  if (app.waiting) return;
  app.waiting = true;
  render(true);
  while (app.waiting) {
    try {
      await app.transport.openSession({ timeoutMs: SESSION_OPEN_TRY_MS });
    } catch (error) {
      if (!app.waiting) return;
      if (
        ['serial_timeout', 'serial_write_timeout', 'device_session_expired'].includes(error?.code)
      ) {
        await sleep(SESSION_RETRY_MS);
        continue;
      }
      if (error?.code === 'device_session_busy') {
        // Another page opened a session a moment ago: the Passport lets go of an idle one soon.
        say('另一个设置页面刚刚连接过 Passport，几秒后自动重试', 'warn');
        await sleep(SESSION_BUSY_RETRY_MS);
        continue;
      }
      app.waiting = false;
      handleFailure(error);
      render(true);
      return;
    }
    if (!app.waiting) return; // cancelled while the answer was on its way
    app.waiting = false;
    app.connected = true;
    try {
      if (acceptState(await app.transport.stateGet())) {
        say('', '');
        render(true);
      }
    } catch (error) {
      app.connected = false;
      handleFailure(error);
      render(true);
    }
    return;
  }
}

async function connectHttp(event) {
  event?.preventDefault();
  const code = normalizeAccessCode(byId('code-input').value);
  if (code.length !== 19) return say('访问码是 16 位，格式 XXXX-XXXX-XXXX-XXXX', 'error');
  app.transport.setCode(code);
  app.connecting = true;
  app.ended = false;
  say('', '');
  render(true);
  try {
    const first = await app.transport.openSession();
    byId('code-input').value = '';
    app.connected = true;
    app.connecting = false;
    if (!acceptState(first)) return undefined;
    render(true);
  } catch (error) {
    app.connecting = false;
    app.connected = false;
    handleFailure(error);
    render(true);
  }
  return undefined;
}

async function disconnect() {
  app.waiting = false;
  app.connected = false;
  app.state = null;
  app.validateJob = '';
  clearSecrets();
  await app.transport.close();
  say('USB 已断开', '');
  render(true);
}

function release() {
  app.waiting = false;
  app.connected = app.connecting = false;
  app.state = null;
  clearSecrets();
  byId('code-input').value = '';
  void app.transport.close();
  render(true);
}

// ---------------------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------------------

function bind() {
  byId('code-form').addEventListener('submit', connectHttp);
  byId('code-input').addEventListener('input', (event) => {
    event.target.value = normalizeAccessCode(event.target.value);
  });
  byId('usb-connect').addEventListener('click', connectSerial);
  byId('usb-disconnect').addEventListener('click', disconnect);
  byId('add-account').addEventListener('click', () => openSheet('codex'));
  byId('add-wifi').addEventListener('click', () => openWifiForm());
  byId('wifi-form').addEventListener('submit', saveWifi);
  byId('wifi-cancel').addEventListener('click', () => {
    app.wifiForm = null;
    byId('wifi-password').value = '';
    render(true);
  });
  byId('wifi-show').addEventListener('change', (event) => {
    byId('wifi-password').type = event.target.checked ? 'text' : 'password';
  });
  byId('refresh-select').addEventListener('change', saveSettings);
  byId('sleep-select').addEventListener('change', saveSettings);
  byId('finish').addEventListener('click', finish);
  byId('cancel-auth').addEventListener('click', cancelAuthorization);
  byId('pick-codex').addEventListener('click', () => openSheet('codex'));
  byId('pick-deepseek').addEventListener('click', () => openSheet('deepseek'));
  byId('codex-form').addEventListener('submit', addCodex);
  byId('deepseek-form').addEventListener('submit', addDeepseek);
  byId('deepseek-show').addEventListener('change', (event) => {
    byId('deepseek-key').type = event.target.checked ? 'text' : 'password';
  });
  byId('sheet-cancel').addEventListener('click', closeSheet);
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && app.sheet) closeSheet();
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) void poll();
  });
  window.addEventListener('pagehide', release);
  // An open USB session also polls while the page is hidden: the Passport treats a silent page as
  // gone after a few seconds. A hidden hotspot page stays quiet.
  setInterval(() => {
    const wait = validating() ? POLL_VALIDATING_MS : POLL_MS;
    const active = !document.hidden || (app.transport.kind === 'serial' && app.connected);
    if (active && app.connected && Date.now() - app.lastPollAt >= wait - 100) void poll();
    renderRemaining();
  }, 1000);
}

function start() {
  const hotspot = location.protocol === 'http:';
  app.transport = hotspot
    ? createHttpTransport((path, init) => fetch(path, init))
    : createSerialTransport(navigator);
  bind();
  if (!app.transport.supported) {
    app.blocked = 'unsupported_browser';
    render(true);
    return;
  }
  render(true);
  if (hotspot) {
    // The QR code carries the access code in the address fragment; read it once and remove it.
    const fragment = new URLSearchParams(location.hash.slice(1)).get('code');
    history.replaceState(null, '', location.pathname + location.search);
    const code = normalizeAccessCode(fragment ?? '');
    if (code.length === 19) {
      byId('code-input').value = code;
      void connectHttp();
    }
  }
}

start();
</script>
</body>
</html>
